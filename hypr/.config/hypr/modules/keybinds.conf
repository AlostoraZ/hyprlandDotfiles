$mainMod = ALT

# Example binds, see https://wiki.hypr.land/Configuring/Binds/ for more
bindd = $mainMod, Return, Terminal, exec, kitty
bindd = $mainMod SHIFT, Return, Terminal (Floating and Centered), exec, kitty --title 'centfloa'
bindd = $mainMod, E, File Manager, exec, nemo
bindd = $mainMod, Space, Rofi, exec, pkill rofi || rofi -show drun
bindd = $mainMod, B, Browser, exec, zen-browser
bindd = $mainMod, Q, Killactive, killactive,
bindd = $mainMod, X, Log out, exit,
bindd = $mainMod, P, Pseudo, pseudo, # dwindle
bindd = $mainMod, U, Toggle split direction, togglesplit, # dwindle
bindd = $mainMod, F, Fullscreen, fullscreen, 0 # Set active window to fullscreen
bindd = $mainMod SHIFT, F, Full width, fullscreen, 1 # Set active window to full width
bindd = $mainMod, T, Toggle floating, togglefloating # Toggle active windows into floating mainMode
bindd = $mainMod, W, Swap split, swapsplit # Swapsplit

# Screenshot
# bindd = $mainMod, PRINT, exec, ~/.config/hypr/scripts/screenshot.sh
bindd = , PRINT, Screenshot output, exec, hyprshot -m output -o ~/Pictures/
bindd = SUPER, PRINT, Screenshot window, exec, hyprshot -m window -o ~/Pictures/
bindd = SUPER SHIFT, S, Screenshot region, exec, hyprshot -m region --clipboard-only # fn f6

# Hyprexpo
bindd = $mainMod, G, Workspaces view, hyprexpo:expo, toggle
# bindd = $mainMod, Y, Hyprspace, overview:toggle
bindd = $mainMod SHIFT, G, Bring window to current workspace, exec, pypr fetch_client_menu
bindd = $mainMod SHIFT CTRL, Q, Toggle dpms, exec, pypr toggle_dpms


# Move focus
bindd = $mainMod, h, Move focus left, movefocus, l
bindd = $mainMod, l, Move focus right, movefocus, r
bindd = $mainMod, k, Move focus up, movefocus, u
bindd = $mainMod, j, Move focus down, movefocus, d

# Cycle Through applications on active workspace
bindd = $mainMod, TAB, Cycle next app, cyclenext
bindd = $mainMod SHIFT, TAB, Cycle previous app, cyclenext, prev
bindd = $mainMod, TAB, Bring active to top, bringactivetotop
bindd = $mainMod SHIFT, TAB, Bring active to top, bringactivetotop

# Swap active window
bindd = $mainMod, left, Swap window left, swapwindow, l
bindd = $mainMod, right, Swap window right, swapwindow, r
bindd = $mainMod, up, Swap window up, swapwindow, u
bindd = $mainMod, down, Swap window down, swapwindow, d

# Window resizing
bindd = $mainMod SHIFT, right, Increase window width, resizeactive, 100 0
bindd = $mainMod SHIFT, left, Decrease window width, resizeactive, -100 0
bindd = $mainMod SHIFT, down, Increase window height, resizeactive, 0 100
bindd = $mainMod SHIFT, up, Decrease window height, resizeactive, 0 -100
bindd = $mainMod SHIFT, h, Increase window width, resizeactive, 100 0
bindd = $mainMod SHIFT, l, Decrease window width, resizeactive, -100 0
bindd = $mainMod SHIFT, j, Increase window height, resizeactive, 0 100
bindd = $mainMod SHIFT, k, Decrease window height, resizeactive, 0 -100

# Switch workspaces with mainMod + [0-9]
bindd = $mainMod, 1, Switch to workspace 1, workspace, 1
bindd = $mainMod, 2, Switch to workspace 2, workspace, 2
bindd = $mainMod, 3, Switch to workspace 3, workspace, 3
bindd = $mainMod, 4, Switch to workspace 4, workspace, 4
bindd = $mainMod, 5, Switch to workspace 5, workspace, 5
bindd = $mainMod, 6, Switch to workspace 6, workspace, 6
bindd = $mainMod, 7, Switch to workspace 7, workspace, 7
bindd = $mainMod, 8, Switch to workspace 8, workspace, 8
bindd = $mainMod, 9, Switch to workspace 9, workspace, 9
bindd = $mainMod, 0, Switch to workspace 10, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bindd = $mainMod SHIFT, 1, Move window to workspace 1, movetoworkspace, 1
bindd = $mainMod SHIFT, 2, Move window to workspace 2, movetoworkspace, 2
bindd = $mainMod SHIFT, 3, Move window to workspace 3, movetoworkspace, 3
bindd = $mainMod SHIFT, 4, Move window to workspace 4, movetoworkspace, 4
bindd = $mainMod SHIFT, 5, Move window to workspace 5, movetoworkspace, 5
bindd = $mainMod SHIFT, 6, Move window to workspace 6, movetoworkspace, 6
bindd = $mainMod SHIFT, 7, Move window to workspace 7, movetoworkspace, 7
bindd = $mainMod SHIFT, 8, Move window to workspace 8, movetoworkspace, 8
bindd = $mainMod SHIFT, 9, Move window to workspace 9, movetoworkspace, 9
bindd = $mainMod SHIFT, 0, Move window to workspace 10, movetoworkspace, 10

# Example special workspace (scratchpad)
bindd = $mainMod, M, Toggle special workspace, togglespecialworkspace, magic
bindd = $mainMod SHIFT, M, Move to special workspace, movetoworkspace, special:magic
bindd = $mainMod, comma, Toggle special workspace, togglespecialworkspace, special

bind = $mainMod , N, togglespecialworkspace, stash # toggles "stash" special workspace visibility
bind = $mainMod SHIFT, N, exec, pypr toggle_special stash # moves window to/from the "stash" workspace

# Toggle groups
bindd = SUPER, G, Toggle group, togglegroup
bindd = SUPER SHIFT, G, Move out of group, moveoutofgroup

# Join groups
bindd = SUPER SHIFT, h, Move into group left, moveintogroup, l
bindd = SUPER SHIFT, l, Move into group right, moveintogroup, r
bindd = SUPER SHIFT, k, Move into group up, moveintogroup, u
bindd = SUPER SHIFT, j, Move into group down, moveintogroup, d

# Navigate a single set of grouped windows
bindd = SUPER, TAB, Change group active forward, changegroupactive, f
bindd = SUPER SHIFT, TAB, Change group active backward, changegroupactive, b

# Activate window in a group by number
bindd = SUPER SHIFT, 1, Activate window 1 in group, changegroupactive, 1
bindd = SUPER SHIFT, 2, Activate window 2 in group, changegroupactive, 2
bindd = SUPER SHIFT, 3, Activate window 3 in group, changegroupactive, 3
bindd = SUPER SHIFT, 4, Activate window 4 in group, changegroupactive, 4
bindd = SUPER SHIFT, 5, Activate window 5 in group, changegroupactive, 5

# Scrolling layout
bindd = $mainMod SHIFT, s, Set layout scrolling, exec, hyprctl keyword general:layout 'scrolling'
bindd = $mainMod SHIFT, d, Set layout dwindle, exec, hyprctl keyword general:layout 'dwindle'
# Move view by one column
bindd = $mainMod, equal, Move view +col, layoutmsg, move +col
bindd = $mainMod, minus, Move view -col, layoutmsg, move -col
# Move windows
bindd = $mainMod SHIFT, l, Move window right, layoutmsg, movewindowto r
bindd = $mainMod SHIFT, h, Move window left, layoutmsg, movewindowto l
bindd = $mainMod SHIFT, k, Move window up, layoutmsg, movewindowto u
bindd = $mainMod SHIFT, j, Move window down, layoutmsg, movewindowto d
# Resize columns
bindd = SUPER CTRL, equal, Resize column +0.2, layoutmsg, colresize +0.2
bindd = SUPER CTRL, minus, Resize column -0.2, layoutmsg, colresize -0.2

# Scroll through existing workspaces with mainMod + scroll
bindd = $mainMod, mouse_down, Scroll workspace forward, workspace, e+1
bindd = $mainMod, mouse_up, Scroll workspace backward, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
binddm = $mainMod, mouse:272, Movewindow, movewindow
binddm = $mainMod, mouse:273, Resize window, resizewindow

# Zoom
bindd = SUPER, mouse_down, Zoom in, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bindd = SUPER, mouse_up, Zoom out, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')

bindd = SUPER, equal, Zoom in, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.1')
bindd = SUPER, minus, Zoom out, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.9) | if . < 1 then 1 else . end')

# Laptop multimedia keys for volume and LCD brightness
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
# bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
# bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
# bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
# bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Swayosd
binddel = ,XF86AudioRaiseVolume, Raise volume, exec, swayosd-client --output-volume raise --max-volume 120
binddel = ,XF86AudioLowerVolume, Lower volume, exec, swayosd-client --output-volume lower --max-volume 120
binddel = ,XF86AudioMute, Mute volume, exec, swayosd-client --output-volume mute-toggle
binddel = ,XF86AudioMicMute, Mute mic, exec, swayosd-client --input-volume mute-toggle
binddel = ,XF86MonBrightnessUp, Increase brightness, exec, swayosd-client --brightness +5
binddel = ,XF86MonBrightnessDown, Decrease brightness, exec, swayosd-client --brightness -5

# Requires playerctl
binddl = , XF86AudioNext, Next track, exec, playerctl next
binddl = , XF86AudioPause, Play/Pause, exec, playerctl play-pause
binddl = , XF86AudioPlay, Play/Pause, exec, playerctl play-pause
binddl = , XF86AudioPrev, Previous track, exec, playerctl previous

# Armoury crate key
bindd = ,XF86Launch3, Armoury crate, exec, rog-control-center

# Aura key
bindd = ,XF86Launch4, Aura key, exec, asusctl aura -n

################
#### Submaps####
################

## Rofi

bindd = $mainMod, R, Rofi submap, submap, rofi

submap = rofi, reset
bindd = , B, Show keybinds, exec, $HOME/.config/hypr/scripts/bindsmenu.sh
bindd = , E, Emoji selector, exec, rofi -show emoji
bindd = , C, Calculator, exec, rofi -show calc -no-show-match -no-sort
bindd = $mainMod, R, Reset submap, submap, reset
bindd = , escape, Reset submap, submap, reset
# Clipboard
bindd = , V, Clipboard,exec, cliphist list | rofi -dmenu -p "Clipboard" -display-columns 2 | cliphist decode | wl-copy
bindd = CTRL, V, Wipe Clipboard, exec, cliphist wipe
submap = reset


## Scripts

bindd = $mainMod, S, Scripts submap, submap, scripts

submap = scripts, reset

# Wlogout
bindd = , Q, Wlogout, exec, $HOME/.config/hypr/scripts/wlogout.sh

# Rofi Dmenu
# Theme switcher
# bindd = $mainMod, T, Theme switcher, exec, $HOME/.config/hypr/scripts/theme-switcher.sh
# waybar theme switcher
bindd = , T, Waybar theme switcher, exec, $HOME/.config/waybar/scripts/switcher.sh
# wallpaper switcher
# bindd = $mainMod SHIFT, W, Wallpaper switcher, exec, $HOME/.config/hypr/scripts/wallswitcher.sh

# Waypaper
bindd = , W, Waypaper, exec, waypaper

# Show Desktop
bindd = , M, Show Desktop, exec, $HOME/.config/hypr/scripts/showDesktop.sh

# Hypridle
bindd = , I, Toggle hypridle, exec, $HOME/.config/hypr/scripts/hypridle-toggle.sh

# waybar
bindd = , R, Restart Waybar, exec, $HOME/.config/waybar/scripts/launch.sh

bindd = $mainMod, S, Reset submap, submap, reset
bindd = , escape, Reset submap, submap, reset
submap = reset


## Resize

bindd = $mainMod CTRL, R, Resize submap, submap, resize 

submap = resize
bindd = , h, Increase window width, resizeactive, 100 0
bindd = , l, Decrease window width, resizeactive, -100 0
bindd = , j, Increase window height, resizeactive, 0 100
bindd = , k, Decrease window height, resizeactive, 0 -100
bindd = , L, Increase col size scrolling layout,  layoutmsg, colresize +0.2
bindd = , H, Decrease col size scrolling layout,  layoutmsg, colresize -0.2
bindd = $mainMod CTRL, R, Reset submap, submap, reset
bindd = , escape, Reset submap, submap, reset
submap = reset
